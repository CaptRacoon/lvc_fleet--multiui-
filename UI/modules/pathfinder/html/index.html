<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="sirenbox">
            <div class="pf-button" id="leftalley-button">
                <img src="../textures/day/leftalley_off.png" id="leftalley">
            </div>

            <div class="pf-button" id="ta-left-button">
                <img src="../textures/day/left_off.png" id="ta-left">
            </div>

            <div class="pf-button" id="ta-middle-button">
                <img src="../textures/day/middle_off.png" id="ta-middle">
            </div>

            <div class="pf-button" id="ta-right-button">
                <img src="../textures/day/right_off.png" id="ta-right">
            </div>

            <div class="pf-button" id="rightalley-button">
                <img src="../textures/day/rightalley_off.png" id="rightalley">
            </div>

            <div class="pf-button" id="scene-button">
                <img src="../textures/day/scene_off.png" id="scene">
            </div>

            <div class="pf-button" id="blackout-button">
                <img src="../textures/day/blackout_off.png" id="blackout">
            </div>

            <div class="pf-button" id="horn-button">
                <img src="../textures/day/horn_off.png" id="horn">
            </div>

            <div class="pf-button" id="tkd-button">
                <img src="../textures/day/tkd_off.png" id="tkd">
            </div>


            <div class="pf-ta-display" id="ta-display-wrapper">
                <img src="" id="ta-gif" alt="Traffic advisor">
            </div>


            <div class="pf-switch" id="switch-button">
                <img src="../textures/day/switch_1.png" id="switch">
            </div>

            <div class="pf-knob" id="siren-button">
                <img src="../textures/day/siren_off.png" id="siren">
            </div>
        </div>

        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script src="lvc.js" type="text/javascript"></script>
    </body>
</html>
